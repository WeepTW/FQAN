name: Release checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  public-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: src/requirements.txt
      - name: Check release contents
        shell: bash
        run: |
          set -euo pipefail
          test -f LICENSE
          test ! -d LICENSES
          test -z "$(find . -type l -print -quit)"
          test -z "$(find . -type f -name '*.md' ! -name README.md ! -name AGENTS.md ! -path './docs/asset/folder_structure.md' ! -path './docs/asset/system_workflow.md' ! -path './docs/asset/workspace/directory_roles.md' ! -path './docs/asset/workspace/root_tree.md' ! -path './docs/instructions/narrative/artifacts.md' ! -path './docs/instructions/narrative/evaluation.md' -print -quit)"
          test -z "$(find src/Experiment -mindepth 1 -type d -print -quit)"
          test -z "$(find . -type f \( -name 'backup.sh' -o -name 'backup.md' -o -name '*.orig' -o -name '*.pyc' -o -name '*.log' \) -print -quit)"
          test ! -d docs/code
          test ! -d docs/log
          test ! -d docs/ref
          test ! -d utils/models
          if git grep -I -l -E '(/home/[A-Za-z0-9._-]+/|wtlee4500|127\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}|192\.168\.[0-9]{1,3}\.[0-9]{1,3}|172\.(1[6-9]|2[0-9]|3[01])\.[0-9]{1,3}\.[0-9]{1,3}|10\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}|hf_[A-Za-z0-9]{10,}|sk-[A-Za-z0-9_-]{20,}|github_pat_[A-Za-z0-9_]{10,}|AKIA[0-9A-Z]{16}|BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY)' -- . ':!.github/workflows/release-checks.yml'; then
            exit 1
          fi
      - name: Check Python and shell syntax
        shell: bash
        run: |
          python -m compileall -q src data
          find src data -type f -name '*.sh' -exec bash -n {} +
      - name: Run lightweight regression suites
        env:
          GIT_LFS_SKIP_SMUDGE: "1"
        run: |
          python -m pip install func-timeout openpyxl sympy
          python -B src/dist/test_experiment6_paths.py
          python -B src/dist/test_finqa_target_execution.py
